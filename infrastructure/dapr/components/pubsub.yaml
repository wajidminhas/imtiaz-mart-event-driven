apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: imtiaz-pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "kafka:29092"
  - name: consumerGroup
    value: "imtiaz-services-group"  # ✅ Generic group name
  - name: clientId
    value: "imtiaz-mart"  # ✅ Generic client ID
  - name: authType
    value: "none"
  - name: maxMessageBytes
    value: "1048576"  # 1MB max message size
  - name: initialOffset
    value: "newest"  # Start from newest messages
scopes:
  - product-service
  - payment-service
  - order-service
  - user-service
  - inventory-service
