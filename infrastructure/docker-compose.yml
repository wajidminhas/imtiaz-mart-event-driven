version: '3.8'

services:
  # ... (zookeeper, kafka remain the same) ...

  # PostgreSQL Database for Product Service
  product-db:
    image: postgres:15-alpine
    container_name: imtiaz-product-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # e.g., 'imtiaz'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # e.g., 'secure_password'
      POSTGRES_DB: ${PRODUCT_DB_NAME} # e.g., 'productdb' - This DB will be created automatically
    ports:
      # Map to a unique host port for local access if needed (e.g., for debugging)
      - "5437:5432"
    volumes:
      # Volume for data persistence for this specific DB instance
      - product_db_/var/lib/postgresql/data
      # Optional: Initialization script specific to this DB (if needed)
      # - ./infrastructure/postgres/product-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - imtiaz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imtiaz} -d ${PRODUCT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL Database for User Service (as an example)
  user-db:
    image: postgres:15-alpine
    container_name: imtiaz-user-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME} # e.g., 'userdb'
    ports:
      - "5436:5432" # Different host port
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - imtiaz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imtiaz} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Product Service
  product-service:
    build:
      context: ./services/product-service # Adjust path if necessary
      dockerfile: Dockerfile
    container_name: imtiaz-product-service
    ports:
      - "${PRODUCT_SERVICE_PORT:-8001}:8000" # Expose on a different port
    environment:
      # --- CORRECTED: Point to its dedicated DB instance using the SERVICE NAME ---
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=product-db # Service name of *its own* dedicated DB
      - DB_PORT=5432
      # PRODUCT_DB_NAME is not strictly needed here if the app code just connects to the DB specified by DB_HOST/PORT
      # and the DB service itself (product-db) has POSTGRES_DB set correctly.
      # However, if your app code constructs the DATABASE_URL dynamically, you might pass PRODUCT_DB_NAME too:
      # - POSTGRES_DB=${PRODUCT_DB_NAME} # Optional, if app constructs URL like f"postgresql://{user}:{pw}@{host}:{port}/{db}"
      # Or, explicitly override DATABASE_URL if needed by the app:
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@product-db:5432/${PRODUCT_DB_NAME}?sslmode=disable
      # --- END CORRECTION ---
      # Application (Generic settings)
      - APP_NAME=Product Service
      - DEBUG=${DEBUG:-False}
      # Dapr config (if needed by the application logic)
      # No need to set KAFKA_BOOTSTRAP_SERVERS here if using Dapr pubsub
    networks:
      - imtiaz-network
    depends_on:
      product-db: # Depend on its *own* DB
        condition: service_healthy
      kafka: # Still needs Kafka for events
        condition: service_healthy
    restart: unless-stopped

  # Dapr Sidecar for Product Service
  product-service-dapr:
    image: daprio/daprd:latest
    container_name: imtiaz-product-service-dapr
    command: [
      "./daprd",
      "-app-id", "product-service", # Unique app ID
      "-app-port", "8000",          # Port the app listens on inside the container
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/components",
      "-log-level", "info"
    ]
    volumes:
      - ./infrastructure/dapr/components:/components:ro # Ensure path is correct
    depends_on:
      - product-service
      - kafka  # Dapr sidecar might interact with Kafka if configured via components
    network_mode: "service:product-service" # Share network namespace with the app container
    restart: unless-stopped

  # User Service (Example - now uses its own dedicated DB)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: imtiaz-user-service
    ports:
      - "${USER_SERVICE_PORT:-8000}:8000"
    environment:
      # --- CORRECTED: Point to its dedicated DB instance using the SERVICE NAME ---
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=user-db # Service name of *its own* dedicated DB
      - DB_PORT=5432
      # USER_DB_NAME is not strictly needed here if the app code just connects to the DB specified by DB_HOST/PORT
      # and the DB service itself (user-db) has POSTGRES_DB set correctly.
      # However, if your app code constructs the DATABASE_URL dynamically, you might pass USER_DB_NAME too:
      # - POSTGRES_DB=${USER_DB_NAME} # Optional
      # Or, explicitly override DATABASE_URL if needed by the app:
      # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user-db:5432/${USER_DB_NAME}?sslmode=disable
      # --- END CORRECTION ---
      # ... other user service specific env vars ...
    networks:
      - imtiaz-network
    depends_on:
      user-db: # Depend on its *own* DB
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Dapr Sidecar for User Service
  user-service-dapr:
    image: daprio/daprd:latest
    container_name: imtiaz-user-service-dapr
    command: [
      "./daprd",
      "-app-id", "user-service",
      "-app-port", "8000",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/components",
      "-log-level", "info"
    ]
    volumes:
      - ./infrastructure/dapr/components:/components:ro
    depends_on:
      - user-service
      - kafka
    network_mode: "service:user-service" # Share network namespace with the app container
    restart: unless-stopped

  # Example: Order Service (Add similar blocks for Inventory, Payment, etc.)
  # order-db:
  #   image: postgres:15-alpine
  #   container_name: imtiaz-order-db
  #   environment:
  #     POSTGRES_USER=...
  #     POSTGRES_PASSWORD=...
  #     POSTGRES_DB=${ORDER_DB_NAME} # e.g., 'orderdb'
  #   ports:
  #     - "5438:5432" # Different host port
  #   volumes:
  #     - order_db_/var/lib/postgresql/data
  #   networks:
  #     - imtiaz-network
  #   healthcheck: ...
  #   restart: unless-stopped
  #
  # order-service:
  #   build: ...
  #   container_name: ...
  #   ports: ...
  #   environment:
  #     # --- CORRECTED: Point to its dedicated DB instance using the SERVICE NAME ---
  #     - POSTGRES_USER=...
  #     - POSTGRES_PASSWORD=...
  #     - DB_HOST=order-db # Service name of *its own* dedicated DB
  #     - DB_PORT=5432
  #     # ORDER_DB_NAME is not strictly needed here if the app code just connects to the DB specified by DB_HOST/PORT
  #     # and the DB service itself (order-db) has POSTGRES_DB set correctly.
  #     # Or, explicitly override DATABASE_URL if needed by the app:
  #     # - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/${ORDER_DB_NAME}?sslmode=disable
  #     # --- END CORRECTION ---
  #     # ... other env vars ...
  #   networks:
  #     - imtiaz-network
  #   depends_on:
  #     order-db: # Depend on its *own* DB
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   restart: unless-stopped
  #
  # order-service-dapr:
  #   image: ...
  #   container_name: ...
  #   command: ...
  #   volumes: ...
  #   depends_on:
  #     - order-service
  #     - kafka
  #   network_mode: "service:order-service"
  #   restart: unless-stopped

volumes:
  - product_db_ # Named volume for product DB persistence
  - user_db_    # Named volume for user DB persistence
  # order_db_data: # Named volume for order DB persistence (add as needed)

networks:
  imtiaz-network:
    driver: bridge