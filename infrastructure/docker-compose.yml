version: '3.8'

networks:
  imtiaz-network:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: imtiaz-zookeeper
    networks:
      - imtiaz-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: imtiaz-kafka
    networks:
      - imtiaz-network
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  product-db:
    image: postgres:15-alpine
    container_name: imtiaz-product-db
    networks:
      - imtiaz-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PRODUCT_DB_NAME}
    ports:
      - "5437:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PRODUCT_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user-db:
    image: postgres:15-alpine
    container_name: imtiaz-user-db
    networks:
      - imtiaz-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${USER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # PRODUCT SERVICE (FIXED)
  # ========================================
  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        BUILD_DATE: "2025-11-09"
    image: imtiaz-mart/product-service:1.0.0
    container_name: imtiaz-product-service
    networks:
      - imtiaz-network
    ports:
      - "${PRODUCT_SERVICE_PORT:-8001}:8001"  # ✅ Fixed: 8001:8001
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@product-db:5432/${PRODUCT_DB_NAME}
      - APP_NAME=Product Service
      - DEBUG=${DEBUG:-true}  # ✅ true for development
      - DAPR_HTTP_PORT=3501
      - DAPR_GRPC_PORT=50002
      - PUBSUB_NAME=imtiaz-pubsub
    volumes:
      - ../services/product-service:/app
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      
    restart: unless-stopped

  product-service-dapr:
    image: daprio/daprd:latest
    container_name: imtiaz-product-service-dapr
    command: [
      "./daprd",
      "-app-id", "product-service",
      "-app-port", "8001",  # ✅ Fixed: Changed to 8001
      "-dapr-http-port", "3501",
      "-dapr-grpc-port", "50002",
      "-components-path", "/components",
      "-config", "/config/config.yaml",  # ✅ Added config
      "-log-level", "debug"  # ✅ Changed to debug for troubleshooting
    ]
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config.yaml:/config/config.yaml:ro  # ✅ Added config volume
    depends_on:
      - product-service
      - kafka
    network_mode: "service:product-service"
    restart: unless-stopped

  # ========================================
  # USER SERVICE
  # ========================================
  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
    image: imtiaz-mart/user-service:1.0.0
    container_name: imtiaz-user-service
    networks:
      - imtiaz-network
    ports:
      - "${USER_SERVICE_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@user-db:5432/${USER_DB_NAME}
      - APP_NAME=User Service
      - DEBUG=${DEBUG:-true}  # ✅ Changed to true for dev
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      - PUBSUB_NAME=imtiaz-pubsub
    volumes:
      - ../services/user-service/uv.lock:/app/uv.lock
    depends_on:
      user-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-service-dapr:
    image: daprio/daprd:latest
    container_name: imtiaz-user-service-dapr
    command: [
      "./daprd",
      "-app-id", "user-service",
      "-app-port", "8000",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/components",
      "-config", "/config/config.yaml",  # ✅ Added config
      "-log-level", "debug"  # ✅ Changed to debug
    ]
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config.yaml:/config/config.yaml:ro  # ✅ Added config volume
    depends_on:
      - user-service
      - kafka
    network_mode: "service:user-service"
    restart: unless-stopped
  # ========================================
  # ORDER DATABASE
  # ========================================
  order-db:
    image: postgres:15-alpine
    container_name: imtiaz-order-db
    networks:
      - imtiaz-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "5438:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # ORDER SERVICE
  # ========================================
  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        BUILD_DATE: "2025-11-29"
    image: imtiaz-mart/order-service:1.0.0
    container_name: imtiaz-order-service
    networks:
      - imtiaz-network
    ports:
      - "${ORDER_SERVICE_PORT:-8003}:8003"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@order-db:5432/${ORDER_DB_NAME}
      - APP_NAME=Order Service
      - DEBUG=${DEBUG:-true}
      - DAPR_HTTP_PORT=3503
      - DAPR_GRPC_PORT=50004
      - PUBSUB_NAME=imtiaz-pubsub
    volumes:
      - ../services/order-service/uv.lock:/app/uv.lock
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-service-dapr:
    image: daprio/daprd:latest
    container_name: imtiaz-order-service-dapr
    command: [
      "./daprd",
      "-app-id", "order-service",
      "-app-port", "8003",
      "-dapr-http-port", "3503",
      "-dapr-grpc-port", "50004",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info"
    ]
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config.yaml:/config/config.yaml:ro
    depends_on:
      - order-service
      - kafka
    network_mode: "service:order-service"
    restart: unless-stopped
  
  # ========================================
  # INVENTORY DATABASE
  # ========================================
  inventory-db:
    image: postgres:15-alpine
    container_name: imtiaz-inventory-db
    networks:
      - imtiaz-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${INVENTORY_DB_NAME}
    ports:
      - "5439:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # INVENTORY SERVICE
  # ========================================
  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
      args:
        VERSION: "1.0.0"
        BUILD_DATE: "2025-12-11"
    image: imtiaz-mart/inventory-service:1.0.0
    container_name: imtiaz-inventory-service
    networks:
      - imtiaz-network
    ports:
      - "${INVENTORY_SERVICE_PORT:-8004}:8004"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inventory-db:5432/${INVENTORY_DB_NAME}
      - APP_NAME=Inventory Service
      - DEBUG=${DEBUG:-true}
      - DAPR_HTTP_PORT=3504
      - DAPR_GRPC_PORT=50005
      - PUBSUB_NAME=imtiaz-pubsub
    volumes:
      - ../services/inventory-service/uv.lock:/app/uv.lock
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  inventory-service-dapr:
    image: daprio/daprd:latest
    container_name: imtiaz-inventory-service-dapr
    command: [
      "./daprd",
      "-app-id", "inventory-service",
      "-app-port", "8004",
      "-dapr-http-port", "3504",
      "-dapr-grpc-port", "50005",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info"
    ]
    volumes:
      - ./dapr/components:/components:ro
      - ./dapr/config.yaml:/config/config.yaml:ro
    depends_on:
      - inventory-service
      - kafka
    network_mode: "service:inventory-service"
    restart: unless-stopped

volumes:
  product_db_data:
  user_db_data:
  order_db_data:
  inventory_db_data:
