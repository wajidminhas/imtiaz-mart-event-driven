
version: '3.8'

services:
  # ========== Kafka & ZooKeeper ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - imtiaz-mart-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - imtiaz-mart-net

  # ========== User Service DB ==========
  user-db:
    image: postgres:15
    container_name: user-service-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - imtiaz-mart-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== User Service App ==========
  user-service:
    build: ./user-service
    container_name: user-service
    env_file:
      - ./user-service/.env
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - imtiaz-mart-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  # ========== Dapr Sidecar for User Service ==========
  dapr-user-sidecar:
    image: daprio/daprd:1.12
    command: [
      "./daprd",
      "-app-id", "user-service",
      "-app-port", "8001",
      "-dapr-http-port", "3500",
      "-components-path", "/components"
    ]
    volumes:
      - ./components:/components
    depends_on:
      - user-service
      - kafka
    network_mode: "service:user-service"  # Shares localhost with user-service
    # So your app can call http://localhost:3500

volumes:
  user_db_data:

networks:
  imtiaz-mart-net:
    driver: bridge