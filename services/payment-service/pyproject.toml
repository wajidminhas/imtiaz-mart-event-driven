[project]
name = "payment-service"
version = "0.1.0"
description = "Payment Service for Imtiaz Mart - handles PayFast and Stripe payments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.17.1",
    "dapr>=1.16.0",
    "dapr-ext-grpc>=1.16.0",
    "fastapi>=0.120.2",
    "grpcio-tools>=1.76.0",
    "protobuf>=6.33.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "behave>=1.2.6",
    "faker>=37.12.0",
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=4.1.0",
]
