
// Protocol Buffer Definition for Product Events
// Version: proto3 (latest)

syntax = "proto3";

// Package name (like Python module)
package product;

// ========================================
// Product Created Event
// Sent when new product is created
// ========================================
message ProductCreated {
  int32 product_id = 1;           // Field number 1
  string name = 2;                // Field number 2
  string description = 3;         // Optional field
  double price = 4;               // Decimal price
  int32 stock_quantity = 5;       // Available stock
  bool is_active = 6;             // Product status
  string created_at = 7;          // ISO timestamp
}

// ========================================
// Product Updated Event
// Sent when product is modified
// ========================================
message ProductUpdated {
  int32 product_id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock_quantity = 5;
  bool is_active = 6;
  string updated_at = 7;
}

// ========================================
// Product Deleted Event
// Sent when product is soft-deleted
// ========================================
message ProductDeleted {
  int32 product_id = 1;
  string name = 2;
  string deleted_at = 3;
  string reason = 4;              // Why deleted (optional)
}

// ========================================
// Stock Changed Event
// Sent when stock quantity changes
// For Inventory Service to track
// ========================================
message StockChanged {
  int32 product_id = 1;
  int32 old_quantity = 2;
  int32 new_quantity = 3;
  string changed_at = 4;
  string changed_by = 5;          // User/Service that changed it
}